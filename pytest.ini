[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers -p no:deepeval
markers =
    unit: Fast isolated unit tests with synthetic mocks (< 5ms)
    integration: Service, API, database, and reader integration tests
    system: Multi-component end-to-end pipeline executions
    e2e: End-to-end API lifecycle and Playwright UI automation tests
    live_r2: Tests that make physical calls to Cloudflare R2 (opt-in via --run-live-r2)
    heavy_model: Tests that load full neural weights into memory (opt-in via --run-heavy-models)
    gpu: Tests that require a CUDA device (skipped automatically when absent)
