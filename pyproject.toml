[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uth-data-mining"
version = "0.1.0"
description = "Graph-Based Trend Analysis and Hybrid Graph-RAG of LLM Research Papers"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "networkx>=3.2.0",
    "pyvis>=0.3.2",
    "mlxtend>=0.23.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "requests>=2.31.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "lancedb>=0.13.0",
    "google-genai>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "gpu: marks tests as requiring a CUDA-enabled GPU (deselect with '-m \"not gpu\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Frozen one-shot experiment scripts carry legacy lint debt; they are excluded
# from strict maintained architecture lint checks.
extend-exclude = [
    "src/experiments/exp_*.py",
    "src/experiments/plot_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# CLI scripts bootstrap sys.path before importing src.* modules (E402)
"src/training/*.py" = ["E402"]
"src/experiments/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
