[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uth-scientific-lakehouse"
version = "0.1.0"
description = "Reproducible arXiv ingestion, Parquet analytics and local vector indexing."
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "boto3>=1.34,<2", "duckdb>=1.0,<2", "pandas>=2.2,<3",
    "pyarrow>=15,<26", "httpx[http2]>=0.27,<1", "feedparser>=6,<7",
    "xmltodict>=0.13,<2", "beautifulsoup4>=4.12,<5", "tenacity>=8.3,<10",
    "python-dotenv>=1.0,<2", "tabulate>=0.9,<1",
]

[project.optional-dependencies]
indexing = ["lancedb>=0.13,<1", "torch>=2.2,<3", "transformers>=4.40,<6"]
mining = ["bertopic>=0.16,<1", "networkx>=3.2,<4", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "ruff>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: explicit opt-in tests against live external services",
    "gpu: marks tests as requiring a CUDA-enabled GPU (deselect with '-m \"not gpu\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Frozen one-shot experiment scripts carry legacy lint debt; they are excluded
# from strict maintained architecture lint checks.
extend-exclude = [
    "src/experiments/exp_*.py",
    "src/experiments/plot_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# CLI scripts bootstrap sys.path before importing src.* modules (E402)
"src/training/*.py" = ["E402"]
"src/experiments/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
