<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--y:#ffd400;--k:#141414;--w:#fff;--g:#5a5a5a}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;color:var(--k);font-family:"Hanken Grotesk",sans-serif}
.band{background:var(--y);display:grid;grid-template-columns:auto 1fr auto;align-items:center;height:150px;padding:0 48px;gap:36px}
.gate{font-weight:900;font-size:120px;line-height:1}
.msg{font-weight:700;font-size:44px;line-height:1.1}
.msg small{display:block;font-size:22px;font-weight:500;margin-top:6px}
.pic{width:88px;height:88px;background:var(--k);color:var(--w);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:40px}
main{display:grid;grid-template-columns:1fr 420px;gap:56px;padding:44px 48px}
.rows{display:flex;flex-direction:column;gap:16px}
.row{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center;font-size:22px;font-weight:700}
.bar{display:flex;height:40px}.bar i{display:block}
.a{background:var(--k)}.b{background:#6b6b6b}.c{background:#b5b5b5}.o{background:#ececec}
.side{border-left:8px solid var(--k);padding-left:28px;display:flex;flex-direction:column;gap:20px}
.side .v{font-weight:900;font-size:110px;line-height:.9}
.side p{font-size:24px;font-weight:500;line-height:1.35}
.side .y{background:var(--y);padding:14px 18px;font-weight:700;font-size:22px}
</style></head><body>
<div class="band"><div class="gate">07</div><div class="msg">6 cụm chủ đề, các chủ đề chồng lấn<small>Unsupervised · Clustering · K-Means k = 6, GMM trên mẫu 800 bài</small></div><div class="pic">→</div></div>
<main>
  <div class="rows">
    <div class="row">Cụm 0 · Robot<div class="bar" style="width:51%"><i class="a" style="flex:77"></i><i class="b" style="flex:15"></i><i class="c" style="flex:4"></i><i class="o" style="flex:6"></i></div></div>
    <div class="row">Cụm 1 · ML<div class="bar" style="width:100%"><i class="a" style="flex:45"></i><i class="b" style="flex:36"></i><i class="c" style="flex:30"></i><i class="o" style="flex:88"></i></div></div>
    <div class="row">Cụm 2 · Agent<div class="bar" style="width:46%"><i class="a" style="flex:28"></i><i class="b" style="flex:22"></i><i class="c" style="flex:10"></i><i class="o" style="flex:32"></i></div></div>
    <div class="row">Cụm 3 · NLP<div class="bar" style="width:72%"><i class="a" style="flex:64"></i><i class="b" style="flex:25"></i><i class="c" style="flex:22"></i><i class="o" style="flex:32"></i></div></div>
    <div class="row">Cụm 4 · CV<div class="bar" style="width:90%"><i class="a" style="flex:104"></i><i class="b" style="flex:46"></i><i class="c" style="flex:4"></i><i class="o" style="flex:25"></i></div></div>
    <div class="row">Cụm 5 · 3D<div class="bar" style="width:43%"><i class="a" style="flex:70"></i><i class="b" style="flex:10"></i><i class="c" style="flex:2"></i><i class="o" style="flex:3"></i></div></div>
  </div>
  <div class="side"><div class="v">0,047</div><p>Silhouette gần 0: điểm nằm sát biên giữa các cụm.</p><div class="y">DBSCAN: 1 cụm, nhiễu 1,0%</div></div>
</main>
</body></html>
