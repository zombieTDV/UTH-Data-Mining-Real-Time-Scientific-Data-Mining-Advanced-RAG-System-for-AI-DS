name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & Test Suite (CPU)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies (CPU)
        run: |
          pip install -e ".[dev,indexing]"
          pip install ruff

      - name: Install package editable
        run: |
          pip install -e .

      - name: Lint with Ruff
        run: |
          ruff check src tests

      - name: Run test suite
        run: |
          pytest -v -m "not gpu and not integration"
