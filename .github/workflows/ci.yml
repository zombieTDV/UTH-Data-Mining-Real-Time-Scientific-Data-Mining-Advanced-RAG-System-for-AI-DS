name: backend-ci
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      RETRIEVAL_MODE: mock
      LLM_MODE: mock
      GATEWAY_PORT: 8000
      LLM_PORT: 9001
      LLM_SERVICE_URL: http://localhost:9001
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
