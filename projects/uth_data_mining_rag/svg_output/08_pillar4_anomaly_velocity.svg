<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
     font-size="12" lang="vi-VN">
    <!-- Background Canvas -->
    <rect width="1280" height="720" fill="#F8FAFC"/>

    <g id="header" data-pptx-bounds="80 50 1120 70">
        <text x="80" y="65" font-size="12" font-weight="700" fill="#2563EB">4. CÁC TRỤ CỘT KHAI PHÁ DỮ LIỆU</text>
        <text x="80" y="98" font-size="26" font-weight="700" fill="#0F172A">Trụ Cột 4: Phát Hiện Dị Biệt Cấu Trúc &amp; Động Lượng Xu Hướng</text>
    </g>

    <g id="iso-box" data-pptx-bounds="80 140 530 510">
        <rect x="80" y="140" width="530" height="510" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="110" y="185" font-size="18" font-weight="700" fill="#2563EB">1. Phát Hiện Dị Biệt (Isolation Forest)</text>
        <text x="110" y="225" font-size="13" font-weight="700" fill="#0F172A">• Nguyên lý thuật toán Isolation Forest:</text>
        <text x="125" y="245" font-size="11.5" font-weight="normal" fill="#64748B">Cô lập điểm bất thường dựa trên độ dài đường đi (path</text>
        <text x="125" y="265" font-size="11.5" font-weight="normal" fill="#64748B">length) ngắn trong cây quyết định ngẫu nhiên, tối ưu</text>
        <text x="125" y="285" font-size="11.5" font-weight="normal" fill="#64748B">cho dữ liệu nhiều chiều.</text>
        <text x="110" y="295" font-size="13" font-weight="700" fill="#0F172A">• Phép biến đổi đặc trưng Log-Scale:</text>
        <text x="125" y="315" font-size="11.5" font-weight="normal" fill="#64748B">Áp dụng log(1 + x) cho các thuộc tính có độ lệch lớn:</text>
        <text x="125" y="335" font-size="11.5" font-weight="normal" fill="#64748B">số lượng công thức, số trang, số bảng biểu và số liên</text>
        <text x="125" y="355" font-size="11.5" font-weight="normal" fill="#64748B">kết trích dẫn.</text>
        <rect x="110" y="365" width="470" height="75" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
        <text x="126" y="391" font-size="13" font-weight="700" fill="#9A3412">Phát hiện 30 Bài báo Dị biệt Cấu trúc (Outliers)</text>
        <text x="126" y="413" font-size="11" fill="#C2410C">• Bóc tách các chuyên khảo (Monographs / Book chapters dày hàng trăm trang)</text>
        <text x="126" y="430" font-size="11" fill="#C2410C">• Nhận diện bài báo toán học thuần túy chứa hàng chục ngàn công thức.</text>
        <text x="110" y="465" font-size="13" font-weight="700" fill="#0F172A">• Lợi ích thực tiễn trong hệ thống RAG:</text>
        <text x="125" y="485" font-size="11.5" font-weight="normal" fill="#64748B">Lọc sạch các tệp bất thường để không làm 'nghẽn' bộ</text>
        <text x="125" y="505" font-size="11.5" font-weight="normal" fill="#64748B">nhớ khi phân mảnh chunk và tránh pha loãng độ tương</text>
        <text x="125" y="525" font-size="11.5" font-weight="normal" fill="#64748B">đồng cosine.</text>
    </g>

    <g id="velocity-box" data-pptx-bounds="670 140 530 510">
        <rect x="670" y="140" width="530" height="510" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="700" y="185" font-size="18" font-weight="700" fill="#F97316">2. Động Lượng Xu Hướng (Trend Velocity)</text>
        <text x="700" y="225" font-size="13" font-weight="700" fill="#0F172A">• Công thức Tốc độ Tăng trưởng Tỷ trọng (Delta Share):</text>
        <text x="715" y="247" font-size="12" font-family="monospace" fill="#2563EB">Delta_Share = Share(t) - Share(t-1)</text>
        <text x="715" y="265" font-size="11.5" font-weight="normal" fill="#64748B">Đo lường sự dịch chuyển dòng chảy nghiên cứu theo</text>
        <text x="715" y="285" font-size="11.5" font-weight="normal" fill="#64748B">chuỗi thời gian.</text>

        <rect x="700" y="295" width="470" height="60" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
        <text x="716" y="319" font-size="13" font-weight="700" fill="#065F46">SURGING (Tăng Trưởng Nóng)</text>
        <text x="716" y="340" font-size="11.5" font-weight="normal" fill="#64748B">Diffusion Distillation, Multimodal Agents, LLM</text>
        <text x="716" y="360" font-size="11.5" font-weight="normal" fill="#64748B">Reasoning, Mathematical Proofs.</text>

        <rect x="700" y="370" width="470" height="60" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="716" y="394" font-size="13" font-weight="700" fill="#1E40AF">STABLE (Bền Vững / Cân Bằng)</text>
        <text x="716" y="415" font-size="11.5" font-weight="normal" fill="#64748B">Object Detection, Time-Series Forecasting, Semantic</text>
        <text x="716" y="435" font-size="11.5" font-weight="normal" fill="#64748B">Segmentation truyền thống.</text>

        <rect x="700" y="445" width="470" height="60" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
        <text x="716" y="469" font-size="13" font-weight="700" fill="#9F1239">DECLINING (Bão Hòa / Giảm Dần)</text>
        <text x="716" y="490" font-size="11.5" font-weight="normal" fill="#64748B">Các kiến trúc mạng nơ-ron cũ bị thay thế bởi</text>
        <text x="716" y="510" font-size="11.5" font-weight="normal" fill="#64748B">Transformer và Foundation Models.</text>
    </g>

</svg>