<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
     font-size="12" lang="vi-VN">
    <!-- Background Canvas -->
    <rect width="1280" height="720" fill="#F8FAFC"/>

    <g id="header" data-pptx-bounds="80 50 1120 70">
        <text x="80" y="65" font-size="12" font-weight="700" fill="#2563EB">1. TỔNG QUAN &amp; ĐẶT VẤN ĐỀ</text>
        <text x="80" y="98" font-size="26" font-weight="700" fill="#0F172A">Bối Cảnh Nghiên Cứu &amp; Những Thách Thức Cốt Lõi</text>
    </g>

    <g id="col-1" data-pptx-bounds="80 140 350 510">
        <rect x="80" y="140" width="350" height="510" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <rect x="80" y="140" width="350" height="8" rx="4" fill="#2563EB"/>
        <text x="110" y="185" font-size="18" font-weight="700" fill="#2563EB">1. Bùng Nổ Ấn Phẩm AI</text>
        <text x="110" y="215" font-size="11" font-weight="700" fill="#64748B">TỐC ĐỘ XUẤT BẢN THEO HÀM MŨ</text>
        <text x="110" y="255" font-size="13" font-weight="700" fill="#0F172A">Hàng ngàn bài báo mới / tuần:</text>
        <text x="110" y="280" font-size="11.5" font-weight="normal" fill="#64748B">Kho lưu trữ arXiv và OpenAlex ghi nhận</text>
        <text x="110" y="300" font-size="11.5" font-weight="normal" fill="#64748B">lượng ấn phẩm AI/DS tăng đột biến, vượt</text>
        <text x="110" y="320" font-size="11.5" font-weight="normal" fill="#64748B">quá khả năng đọc của con người.</text>
        <text x="110" y="370" font-size="13" font-weight="700" fill="#0F172A">Tìm kiếm từ khóa bất lực:</text>
        <text x="110" y="395" font-size="11.5" font-weight="normal" fill="#64748B">Tìm kiếm truyền thống chỉ quét ký tự</text>
        <text x="110" y="415" font-size="11.5" font-weight="normal" fill="#64748B">nông, không hiểu được quan hệ liên ngành</text>
        <text x="110" y="435" font-size="11.5" font-weight="normal" fill="#64748B">và cấu trúc tri thức sâu.</text>
        <text x="110" y="480" font-size="13" font-weight="700" fill="#0F172A">Nhu cầu cấp thiết:</text>
        <text x="110" y="505" font-size="11.5" font-weight="normal" fill="#64748B">Cần một đường ống tự động hóa bóc tách,</text>
        <text x="110" y="525" font-size="11.5" font-weight="normal" fill="#64748B">chuẩn hóa và phân tích ngữ nghĩa sâu.</text>
    </g>

    <g id="col-2" data-pptx-bounds="465 140 350 510">
        <rect x="465" y="140" width="350" height="510" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <rect x="465" y="140" width="350" height="8" rx="4" fill="#F97316"/>
        <text x="495" y="185" font-size="18" font-weight="700" fill="#F97316">2. Ảo Giác Của LLMs</text>
        <text x="495" y="215" font-size="11" font-weight="700" fill="#64748B">NGUY CƠ SAI LỆCH HỌC THUẬT</text>
        <text x="495" y="255" font-size="13" font-weight="700" fill="#0F172A">Trích dẫn giả mạo (Hallucination):</text>
        <text x="495" y="280" font-size="11.5" font-weight="normal" fill="#64748B">Các mô hình như ChatGPT thường tự bịa</text>
        <text x="495" y="300" font-size="11.5" font-weight="normal" fill="#64748B">ra tên tác giả, năm xuất bản và công</text>
        <text x="495" y="320" font-size="11.5" font-weight="normal" fill="#64748B">thức toán học không có thật.</text>
        <text x="495" y="370" font-size="13" font-weight="700" fill="#0F172A">Hạn chế vùng kiến thức (Cut-off):</text>
        <text x="495" y="395" font-size="11.5" font-weight="normal" fill="#64748B">Không cập nhật các bài báo SOTA vừa</text>
        <text x="495" y="415" font-size="11.5" font-weight="normal" fill="#64748B">công bố trong vài ngày gần nhất.</text>
        <text x="495" y="480" font-size="13" font-weight="700" fill="#0F172A">Thiếu chứng cứ định vị:</text>
        <text x="495" y="505" font-size="11.5" font-weight="normal" fill="#64748B">Không thể chỉ ra chính xác đoạn văn</text>
        <text x="495" y="525" font-size="11.5" font-weight="normal" fill="#64748B">hoặc bảng biểu gốc làm cơ sở chứng minh.</text>
    </g>

    <g id="col-3" data-pptx-bounds="850 140 350 510">
        <rect x="850" y="140" width="350" height="510" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <rect x="850" y="140" width="350" height="8" rx="4" fill="#10B981"/>
        <text x="880" y="185" font-size="18" font-weight="700" fill="#10B981">3. Giải Pháp Của Đồ Án</text>
        <text x="880" y="215" font-size="11" font-weight="700" fill="#64748B">LAKEHOUSE &amp; GROUNDED RAG</text>
        <text x="880" y="255" font-size="13" font-weight="700" fill="#0F172A">Kiến trúc Medallion Lakehouse:</text>
        <text x="880" y="280" font-size="11.5" font-weight="normal" fill="#64748B">Quản trị dữ liệu 3 tầng: Bronze (raw),</text>
        <text x="880" y="300" font-size="11.5" font-weight="normal" fill="#64748B">Silver (Parquet sạch), Gold (Vectors &amp;</text>
        <text x="880" y="320" font-size="11.5" font-weight="normal" fill="#64748B">Marts).</text>
        <text x="880" y="370" font-size="13" font-weight="700" fill="#0F172A">4 Trụ cột Khai phá Dữ liệu:</text>
        <text x="880" y="395" font-size="11.5" font-weight="normal" fill="#64748B">FP-Growth, KMeans/DBSCAN, Citation</text>
        <text x="880" y="415" font-size="11.5" font-weight="normal" fill="#64748B">PageRank &amp; Isolation Forest.</text>
        <text x="880" y="480" font-size="13" font-weight="700" fill="#0F172A">Bảo chứng Trích dẫn 100%:</text>
        <text x="880" y="505" font-size="11.5" font-weight="normal" fill="#64748B">Mọi luận điểm sinh ra bởi Qwen2.5-7B</text>
        <text x="880" y="525" font-size="11.5" font-weight="normal" fill="#64748B">đều đối soát trực tiếp từ Lakehouse.</text>
    </g>

</svg>