<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
     font-size="12" lang="vi-VN">
    <!-- Background Canvas -->
    <rect width="1280" height="720" fill="#F8FAFC"/>

    <g id="header" data-pptx-bounds="80 50 1120 70">
        <text x="80" y="65" font-size="12" font-weight="700" fill="#2563EB">4. CÁC TRỤ CỘT KHAI PHÁ DỮ LIỆU</text>
        <text x="80" y="98" font-size="26" font-weight="700" fill="#0F172A">Trụ Cột 2: Phân Cụm Ngữ Nghĩa &amp; Đánh Giá Mật Độ Đề Tài</text>
    </g>

    <g id="kmeans-box" data-pptx-bounds="80 140 530 510">
        <rect x="80" y="140" width="530" height="510" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="110" y="185" font-size="18" font-weight="700" fill="#2563EB">1. Không Gian Vector &amp; MiniBatchKMeans (k=6)</text>
        <text x="110" y="225" font-size="13" font-weight="700" fill="#0F172A">• Không gian đặc trưng ngữ nghĩa 768 chiều:</text>
        <text x="125" y="245" font-size="11.5" font-weight="normal" fill="#64748B">Mã hóa Abstract bằng mô hình Nomic Embed v1.5,</text>
        <text x="125" y="265" font-size="11.5" font-weight="normal" fill="#64748B">L2-normalized.</text>
        <text x="110" y="290" font-size="13" font-weight="700" fill="#0F172A">• Giảm chiều với Centered PCA 2D:</text>
        <text x="125" y="310" font-size="11.5" font-weight="normal" fill="#64748B">Chiếu từ 768-D xuống 2D (PC1, PC2), bảo toàn phương</text>
        <text x="125" y="330" font-size="11.5" font-weight="normal" fill="#64748B">sai lớn nhất phục vụ trực quan hóa phân bố không gian</text>
        <text x="125" y="350" font-size="11.5" font-weight="normal" fill="#64748B">trên Web Dashboard.</text>
        <text x="110" y="370" font-size="13" font-weight="700" fill="#0F172A">• 6 Cụm chủ đề cốt lõi phát hiện được:</text>
        <text x="125" y="390" font-size="11.5" font-weight="normal" fill="#64748B">1. LLM/NLP • 2. Computer Vision • 3. Graph Neural</text>
        <text x="125" y="410" font-size="11.5" font-weight="normal" fill="#64748B">Networks • 4. Reinforcement Learning • 5. Math</text>
        <text x="125" y="430" font-size="11.5" font-weight="normal" fill="#64748B">Optimization • 6. Multimodal</text>
        <rect x="110" y="445" width="470" height="60" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="126" y="471" font-size="12" font-weight="700" fill="#1E40AF">Chỉ số đánh giá: Silhouette = 0.0629  •  Davies-Bouldin = 3.98</text>
        <text x="126" y="491" font-size="11" fill="#64748B">Phản ánh bản chất ranh giới mềm (soft boundary) của tài liệu AI hiện đại.</text>
    </g>

    <g id="dbscan-box" data-pptx-bounds="670 140 530 510">
        <rect x="670" y="140" width="530" height="510" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="700" y="185" font-size="18" font-weight="700" fill="#10B981">2. Phân Tích Mật Độ với Thuật Toán DBSCAN</text>
        <text x="700" y="225" font-size="13" font-weight="700" fill="#0F172A">• Cấu hình tham số DBSCAN:</text>
        <text x="715" y="245" font-size="11.5" font-weight="normal" fill="#64748B">eps = 0.38 • min_samples = 15 trên tọa độ PCA chuẩn</text>
        <text x="715" y="265" font-size="11.5" font-weight="normal" fill="#64748B">hóa.</text>
        <rect x="700" y="280" width="470" height="65" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
        <text x="716" y="306" font-size="13" font-weight="700" fill="#065F46">Bóc tách 4 Lõi Nghiên cứu Siêu Đậm đặc</text>
        <text x="716" y="325" font-size="11.5" font-weight="normal" fill="#64748B">Phát hiện các cụm có mật độ công bố tập trung cao nhất</text>
        <text x="716" y="345" font-size="11.5" font-weight="normal" fill="#64748B">mà KMeans dạng cầu (spherical) không phân tách tối ưu</text>
        <text x="716" y="365" font-size="11.5" font-weight="normal" fill="#64748B">được.</text>
        <rect x="700" y="365" width="470" height="65" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
        <text x="716" y="391" font-size="13" font-weight="700" fill="#92400E">Phát hiện 53.5% Điểm Ranh giới (Boundary Noise)</text>
        <text x="716" y="410" font-size="11.5" font-weight="normal" fill="#64748B">DBSCAN chứng minh hơn 50% bài báo thuộc dạng đa ngành</text>
        <text x="716" y="430" font-size="11.5" font-weight="normal" fill="#64748B">(interdisciplinary) nằm ở vùng giao thoa giữa Text và</text>
        <text x="716" y="450" font-size="11.5" font-weight="normal" fill="#64748B">Vision.</text>
        <text x="700" y="460" font-size="13" font-weight="700" fill="#0F172A">• Ý nghĩa học thuật của phép đối chiếu:</text>
        <text x="715" y="485" font-size="11.5" font-weight="normal" fill="#64748B">Kết hợp cả 2 trường phái: Phân hoạch tâm (KMeans) cho</text>
        <text x="715" y="505" font-size="11.5" font-weight="normal" fill="#64748B">cái nhìn vĩ mô, và Mật độ (DBSCAN) để xác thực tính</text>
        <text x="715" y="525" font-size="11.5" font-weight="normal" fill="#64748B">liên ngành của dữ liệu.</text>
    </g>

</svg>